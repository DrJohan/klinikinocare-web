name: Deploy Klinik Inocare Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portal
        uses: actions/checkout@v6
        with:
          path: portal

      - name: Checkout Bioprotein training
        uses: actions/checkout@v6
        with:
          repository: DrJohan/bioprotein_training
          ref: main
          path: sources/training

      - name: Assemble website
        run: |
          mkdir -p public
          mkdir -p public/training

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            portal/site/ public/

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            sources/training/ public/training/

          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4