name: Deploy Klinik Inocare Portal

on:
  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - training_updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portal
        uses: actions/checkout@v6
        with:
          path: portal

      - name: Checkout presentation repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/presentations

          duplicate_ids=$(jq -r '[.presentations[] | select(.enabled != false) | .id] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")' portal/site/presentations.json)
          duplicate_paths=$(jq -r '[.presentations[] | select(.enabled != false) | .path] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")' portal/site/presentations.json)
          if [[ -n "$duplicate_ids" || -n "$duplicate_paths" ]]; then
            [[ -z "$duplicate_ids" ]] || echo "Duplicate presentation ids: $duplicate_ids" >&2
            [[ -z "$duplicate_paths" ]] || echo "Duplicate presentation paths: $duplicate_paths" >&2
            exit 1
          fi

          jq -c '.presentations[] | select(.enabled != false)' portal/site/presentations.json | while IFS= read -r presentation; do
            id=$(jq -r '.id' <<<"$presentation")
            repository=$(jq -r '.repository' <<<"$presentation")
            branch=$(jq -r '.branch // "main"' <<<"$presentation")
            destination=$(jq -r '.path' <<<"$presentation")
            source_dir=$(jq -r '.sourceDir // "."' <<<"$presentation")

            [[ "$id" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid presentation id: $id" >&2; exit 1; }
            [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid repository: $repository" >&2; exit 1; }
            [[ "$branch" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$branch" != *".."* ]] || { echo "Invalid branch: $branch" >&2; exit 1; }
            [[ "$destination" =~ ^training(/[a-z0-9][a-z0-9-]*)*$ ]] || { echo "Invalid presentation path: $destination" >&2; exit 1; }
            [[ "$source_dir" == "." || "$source_dir" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] || { echo "Invalid source directory: $source_dir" >&2; exit 1; }
            [[ "$source_dir" != *".."* ]] || { echo "Invalid source directory: $source_dir" >&2; exit 1; }

            git clone --depth 1 --branch "$branch" "https://github.com/${repository}.git" "sources/presentations/${id}"

            if [[ ! -d "sources/presentations/${id}/${source_dir}" ]]; then
              echo "Source directory not found for $id: $source_dir" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/site/package-lock.json

      - name: Build landing page
        run: |
          npm ci --prefix portal/site
          npm run build --prefix portal/site

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            portal/site/dist/ public/

          jq -c '.presentations[] | select(.enabled != false)' portal/site/presentations.json | while IFS= read -r presentation; do
            id=$(jq -r '.id' <<<"$presentation")
            destination=$(jq -r '.path' <<<"$presentation")
            source_dir=$(jq -r '.sourceDir // "."' <<<"$presentation")

            mkdir -p "public/${destination}"
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              "sources/presentations/${id}/${source_dir}/" "public/${destination}/"
          done

          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
